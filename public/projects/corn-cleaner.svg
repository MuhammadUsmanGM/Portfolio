<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13141f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Flow Header -->
  <text x="600" y="70" fill="#f5a623" font-family="monospace" font-size="14" font-weight="800" letter-spacing="4" text-anchor="middle">TEXTCORN CLEANER BOT — AUTOMATED WATERMARK REMOVAL PIPELINE</text>
  
  <!-- Node 1: Telegram Upload -->
  <g transform="translate(100, 160)">
    <rect width="280" height="340" rx="16" fill="url(#card-grad)" stroke="#f5a623" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="20" y="20" width="240" height="160" rx="10" fill="#1a1b26" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- Image with Watermark -->
    <path d="M 50 140 L 90 90 L 130 130 L 170 80 L 230 150 Z" fill="#f5a623" fill-opacity="0.2"/>
    <circle cx="80" cy="65" r="14" fill="#f5a623" fill-opacity="0.4"/>
    <!-- Watermark text -->
    <text x="140" y="110" fill="#ef4444" font-family="sans-serif" font-size="16" font-weight="900" opacity="0.85" transform="rotate(-15, 140, 110)">WATERMARK</text>
    
    <text x="140" y="225" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">1. Telegram Upload</text>
    <text x="140" y="255" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">User sends photo to @CornCleaner_bot</text>
    <rect x="40" y="280" width="200" height="32" rx="6" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-opacity="0.3"/>
    <text x="140" y="301" fill="#f5a623" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Trigger: /clean or photo</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(400, 310)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#f5a623" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,12 75,20 60,28" fill="#f5a623"/>
  </g>

  <!-- Node 2: Processing Engine -->
  <g transform="translate(490, 160)">
    <rect width="280" height="340" rx="16" fill="url(#card-grad)" stroke="#f5a623" stroke-width="2" filter="url(#glow)"/>
    <rect x="20" y="20" width="240" height="160" rx="10" fill="#0f172a" stroke="#f5a623" stroke-opacity="0.4"/>
    
    <!-- Pulse Ring -->
    <circle cx="140" cy="100" r="45" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="140" cy="100" r="25" fill="#f5a623" fill-opacity="0.2"/>
    <text x="140" y="105" fill="#f5a623" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">CV ENGINE</text>

    <text x="140" y="225" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">2. Dewatermark Engine</text>
    <text x="140" y="255" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">OpenCV + Inpainting Algo</text>
    <rect x="40" y="280" width="200" height="32" rx="6" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-opacity="0.3"/>
    <text x="140" y="301" fill="#f5a623" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Speed: &lt; 3 Seconds</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(790, 310)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#f5a623" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,12 75,20 60,28" fill="#f5a623"/>
  </g>

  <!-- Node 3: Clean Result -->
  <g transform="translate(870, 160)">
    <rect width="280" height="340" rx="16" fill="url(#card-grad)" stroke="#f5a623" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="20" y="20" width="240" height="160" rx="10" fill="#1a1b26" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- Clean Image (No Watermark!) -->
    <path d="M 50 140 L 90 90 L 130 130 L 170 80 L 230 150 Z" fill="#f5a623" fill-opacity="0.4"/>
    <circle cx="80" cy="65" r="14" fill="#f5a623" fill-opacity="0.8"/>
    <!-- Clean Badge -->
    <rect x="140" y="90" width="80" height="24" rx="12" fill="#f5a623"/>
    <text x="180" y="106" fill="#000000" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">✓ CLEAN</text>
    
    <text x="140" y="225" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">3. Clean Photo Returned</text>
    <text x="140" y="255" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Zero watermark artifact left</text>
    <rect x="40" y="280" width="200" height="32" rx="6" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-opacity="0.3"/>
    <text x="140" y="301" fill="#f5a623" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Instant Telegram Reply</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(100, 540)">
    <rect width="1050" height="70" rx="12" fill="#0d0e17" stroke="#f5a623" stroke-opacity="0.2"/>
    <text x="40" y="42" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">LIVE BOT:</text>
    <text x="135" y="42" fill="#f5a623" font-family="monospace" font-size="13" font-weight="900">https://t.me/CornCleaner_bot</text>

    <text x="560" y="42" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">STATUS:</text>
    <text x="635" y="42" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">24/7 PRODUCTION ACTIVE</text>

    <text x="900" y="42" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">TYPE:</text>
    <text x="955" y="42" fill="#f5a623" font-family="monospace" font-size="13" font-weight="900">CLIENT BOT</text>
  </g>
</svg>
