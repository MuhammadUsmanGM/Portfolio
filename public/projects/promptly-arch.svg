<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad_bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 250) rotate(90) scale(300 480)">
      <stop stop-color="#C9960C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#0A0A0A"/>
  <rect width="800" height="500" fill="url(#grad_bg)"/>

  <!-- PHASE 1: THE AGENT REQUEST -->
  <g>
    <rect x="40" y="80" width="160" height="60" rx="12" fill="#1A1A1A" stroke="#C9960C" stroke-opacity="0.4"/>
    <text x="120" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. AGENT QUERY</text>
    <text x="120" y="125" fill="#C9960C" font-family="monospace" font-size="9" text-anchor="middle" opacity="0.7">"How does X work?"</text>
  </g>

  <!-- PHASE 2: THE MCP CALL -->
  <path d="M200 110 H280" stroke="#C9960C" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="240" y="100" fill="#C9960C" font-family="monospace" font-size="8" text-anchor="middle">JSON-RPC Call</text>

  <!-- THE PROMPTLY ENGINE (CENTRAL) -->
  <rect x="280" y="80" width="240" height="340" rx="24" fill="#1A1A1A" stroke="#C9960C" stroke-width="2"/>
  <text x="400" y="115" fill="#C9960C" font-family="sans-serif" font-size="18" font-weight="black" text-anchor="middle">PROMPTLY CORE</text>
  
  <!-- INTERNAL MODULES -->
  <g opacity="0.9">
    <rect x="300" y="150" width="200" height="70" rx="12" fill="#0A0A0A" stroke="#C9960C" stroke-opacity="0.3"/>
    <text x="400" y="175" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AST Parser + Map</text>
    <text x="400" y="195" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Resolving dependencies & naming</text>

    <rect x="300" y="240" width="200" height="70" rx="12" fill="#0A0A0A" stroke="#C9960C" stroke-opacity="0.3"/>
    <text x="400" y="265" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Local Context Inlay</text>
    <text x="400" y="285" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Identifying project signatures</text>

    <rect x="300" y="330" width="200" height="70" rx="12" fill="#C9960C" fill-opacity="0.1" stroke="#C9960C"/>
    <text x="400" y="355" fill="#C9960C" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Context Aggregator</text>
    <text x="400" y="375" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle">GROUNDED PROMPT</text>
  </g>

  <!-- PHASE 3: THE ANALYSIS -->
  <path d="M520 185 H600" stroke="#C9960C" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="600" y="155" width="160" height="60" rx="12" fill="#1A1A1A" stroke="#C9960C" stroke-opacity="0.4"/>
  <text x="680" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LOCAL SOURCE</text>
  <text x="680" y="200" fill="#AAAAAA" font-family="monospace" font-size="9" text-anchor="middle" opacity="0.7">AST & File Metadata</text>

  <!-- PHASE 4: THE RESPONSE -->
  <path d="M280 365 H160" stroke="#C9960C" stroke-width="2" marker-end="url(#arrowhead)"/>
  <g>
    <rect x="20" y="335" width="140" height="60" rx="12" fill="#C9960C" fill-opacity="0.2" stroke="#C9960C"/>
    <text x="90" y="360" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">REFINED CONTEXT</text>
    <text x="90" y="380" fill="#C9960C" font-family="monospace" font-size="9" text-anchor="middle">AI Gains "Proprioception"</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C9960C" />
    </marker>
  </defs>

  <!-- Footer explanation -->
  <text x="400" y="470" fill="#555" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="0.2em">MODEL CONTEXT PROTOCOL (MCP) // GROUNDING FLOW</text>
</svg>
