<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glows -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 250) rotate(90) scale(300 480)">
      <stop stop-color="#C9960C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#0A0A0A"/>
  <rect width="800" height="500" fill="url(#paint0_radial)"/>

  <!-- Layer Labels -->
  <text x="50" y="40" fill="#C9960C" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.2em">INTERACTION LAYER</text>
  <text x="50" y="160" fill="#C9960C" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.2em">MEMORY LAYER (KEYDIR)</text>
  <text x="50" y="320" fill="#C9960C" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.2em">STORAGE LAYER (PERSISTENCE)</text>

  <!-- Connection Lines -->
  <path d="M400 100 V160" stroke="#C9960C" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M400 240 V320" stroke="#C9960C" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Interaction Layer Nodes -->
  <g filter="url(#glow)">
    <rect x="250" y="60" width="120" height="40" rx="8" fill="#1A1A1A" stroke="#C9960C" stroke-opacity="0.5"/>
    <text x="310" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">NAPI-RS (Node)</text>
    
    <rect x="430" y="60" width="120" height="40" rx="8" fill="#1A1A1A" stroke="#C9960C" stroke-opacity="0.5"/>
    <text x="490" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">PyO3 (Python)</text>
  </g>

  <!-- Memory Layer: Hash Table -->
  <rect x="200" y="180" width="400" height="80" rx="12" fill="#1A1A1A" stroke="#C9960C" stroke-width="2"/>
  <text x="400" y="210" fill="#C9960C" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Bitcask-Style Hash Table</text>
  
  <g opacity="0.6">
    <rect x="220" y="225" width="80" height="20" rx="4" fill="#0A0A0A" stroke="#C9960C" stroke-opacity="0.3"/>
    <text x="260" y="238" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Key: "user:123"</text>
    
    <rect x="310" y="225" width="80" height="20" rx="4" fill="#0A0A0A" stroke="#C9960C" stroke-opacity="0.3"/>
    <text x="350" y="238" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Offset: 0x4F</text>
    
    <rect x="400" y="225" width="80" height="20" rx="4" fill="#0A0A0A" stroke="#C9960C" stroke-opacity="0.3"/>
    <text x="440" y="238" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Size: 1024</text>
    
    <text x="520" y="238" fill="#C9960C" font-family="monospace" font-size="10" font-weight="bold">O(1) READ</text>
  </g>

  <!-- Storage Layer: Log + Crypto -->
  <g>
    <!-- Append-only Log -->
    <rect x="200" y="340" width="280" height="100" rx="12" fill="#1A1A1A" stroke="#C9960C" stroke-opacity="0.5"/>
    <text x="340" y="370" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Immutable Data Log</text>
    
    <line x1="220" y1="390" x2="460" y2="390" stroke="#C9960C" stroke-opacity="0.2"/>
    <rect x="220" y="400" width="30" height="20" fill="#C9960C" fill-opacity="0.2" rx="2"/>
    <rect x="255" y="400" width="30" height="20" fill="#C9960C" fill-opacity="0.2" rx="2"/>
    <rect x="290" y="400" width="30" height="20" fill="#C9960C" fill-opacity="0.2" rx="2"/>
    <text x="330" y="415" fill="#C9960C" font-family="monospace" font-size="8">APPEND ONLY</text>
  </g>

  <!-- Crypto Engine -->
  <g filter="url(#glow)">
    <rect x="500" y="340" width="100" height="100" rx="12" fill="#C9960C" fill-opacity="0.1" stroke="#C9960C" stroke-width="2"/>
    <path d="M550 365 V385 M540 375 H560" stroke="#C9960C" stroke-width="2"/>
    <text x="550" y="410" fill="#C9960C" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AES-256-GCM</text>
    <text x="550" y="425" fill="#AAAAAA" font-family="monospace" font-size="8" text-anchor="middle">Authenticated</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M480 390 H500" stroke="#C9960C" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C9960C" />
    </marker>
  </defs>
</svg>
